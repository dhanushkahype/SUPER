# PX4-specific SUPER planner config
# Based on static_dense.yaml, tuned for PX4 SITL + OMMPC integration testing.
# Key changes from stock:
#   - Conservative velocity/acceleration limits for first integration test
#   - click_height disabled so global 3D goal Z passes through unchanged
#   - Vertical map volume expanded for two-storey stairwell navigation
#   - ROG-Map visualization enabled for debugging
#   - raycasting disabled (using ground-truth sim pointcloud)

fsm:
  click_goal_en: true
  click_goal_topic: "/planning/click_goal"
  click_height: -6.0          # disabled (any value <= -5 passes goal Z through unchanged)
  click_yaw_en: true
  replan_rate: 10.0
  cmd_topic: "/planning/pos_cmd"
  mpc_cmd_topic: "/planning_cmd/poly_traj"
  timer_en: true

super_planner:
  backup_traj_en: true
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: false
  visual_process: false
  frontend_in_known_free: true
  # CIRI-side half of frontend_in_known_free (see config.hpp). true = the
  # original lockstep behaviour from 5cf31fb (30 Jul 2026); false stops CIRI
  # treating UNKNOWN voxels as obstacles while leaving A*'s seed-path
  # restriction alone.
  #
  # Set false on measured evidence. A/B/A over the same 5-goal bmich tour,
  # 17 Aug 2026, on VERIFIED-CLEAN stacks (exactly one ros_gz_bridge,
  # /cloud_registered at ~10Hz -- duplicate bridges smear the map and silently
  # invalidate any measurement; an earlier round of this A/B was contaminated
  # that way and had to be thrown out).
  #
  # Rate-normalised, because raw counts scale with how long the tour ran and
  # PlanFromRest fail% is confounded (it conflates how OFTEN a from-rest plan
  # was needed with how often it succeeded -- it read 0.9% and 61.8% on two
  # identical runs, so do not use it as a headline):
  #
  #                              avoid_unknown=true    =false      =false
  #                                   (A, 218s)      (B, 217s)  (B2, 213s)
  #   corridor failures / min           1060.3          18.5        14.1
  #   CIRI infeasible / min              580.8           5.5         8.2
  #     ...unknown-driven / min          491.4           0.0         0.0
  #     ...robot_r-driven / min           89.4           5.5         8.2
  #
  # ~60x fewer corridor failures, and the unknown-driven population goes to
  # EXACTLY zero, reproduced across two independent runs. 5cf31fb's concern
  # (CIRI ballooning into a partially-mapped column) is real but was never
  # flight-validated, and this is what it costs.
  #
  # Honest caveat: all three runs completed the same 5-goal tour with the same
  # two legs timing out, so mission-level behaviour on THIS tour was unchanged.
  # Those two legs fail in global_planner ("only 0%/40% observed ... Goal has no
  # free voxel nearby; aborting plan"), not in SUPER's corridor -- that is the
  # next bottleneck, not this one.
  corridor_avoid_unknown: false
  continuous_following: true
  # Near a static goal (global path end / final click): brake terminal velocity
  # and stop continuous replan so the drone settles instead of oscillating.
  # Orbit carrots stay ~lookahead away and are unaffected.
  goal_stop_dis: 1.20
  goal_arrive_dis: 0.60
  goal_arrive_vel: 0.30
  # Autonomous stuck recovery (plan fail streaks, ~main/replan tick counts).
  # L1 re-snap goal free; L2 temporarily plan through unknown;
  # L2.5 hard-reset in-process ROG local map (clear phantoms);
  # L3 WAIT_GOAL.
  stuck_fail_count: 15
  stuck_relax_count: 30
  stuck_reset_map_count: 40
  stuck_reset_map_cooldown: 20.0   # [s] min time between ROG hard resets
  stuck_give_up_count: 60
  goal_yaw_en: true
  goal_vel_en: false
  corridor_bound_dis: 0.8
  corridor_line_max_length: 1.0
  safe_corridor_line_max_length: 6.0
  iris_iter_num: 2
  obs_skip_num: 2
  replan_forward_dt: 0.1
  planning_horizon: 7.0
  sensing_horizon: -1
  receding_dis: 1.0
  # SUPER plans against the RAW ROG-Map cloud (includes movers, unlike
  # global_planner's OctoMap), so this is the margin that actually governs how
  # close SUPER's own local trajectory passes a currently-visible obstacle --
  # complementary to, not a substitute for, global_planner's
  # path_yield/dynamic_layer (which govern the global carrot, not SUPER's local
  # corridor).
  #
  # History:
  #   0.35 -> 0.42  23 Jul 2026, after a live crash into a mover: the drone got
  #                 boxed in by a dynamic keep-out (global_planner logged "Start
  #                 has no free voxel within 3.0m ... likely boxed in by a
  #                 dynamic keep-out") and collided during the yield hold.
  #   0.42 -> 0.35  17 Aug 2026, tried on request and REVERTED. Once
  #                 corridor_avoid_unknown:false removed the unknown-voxel half,
  #                 the robot_r half was only ~5-8 CIRI rejections/min, so there
  #                 was little left to buy -- and 0.35 measured WORSE on a clean
  #                 stack (60 corridor failures/min vs 14-18 at 0.42) and the
  #                 aircraft clipped geometry on leg 4 and fell (goal correctly
  #                 held 1.55m while the airframe dropped to 0.06m, so this was a
  #                 collision, not the goal-Z ratchet). One crash is not proof
  #                 that 0.35 is unsafe, but there is no measured upside to
  #                 justify spending the margin.
  #
  # Raising rog_map inflation_step to close the same gap from the front-end side
  # is separately DISPROVEN -- see the inflation_step comment below.
  robot_r: 0.42
  yaw_dot_max: 1.5
  yaw_mode: 1
  mpc_horizon: 15

traj_opt:
  switch:
    save_log_en: false
    print_optimizer_log: false

  boundary:
    max_vel: 1.5
    max_acc: 2.0
    max_jerk: 15.0
    max_omg: 1.0
    max_acc_thr: 12.0
    min_acc_thr: 5.0
    penna_margin: 0.05

  exp_traj:
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    scale_factor: 1.0
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: -5.0e+5
    penna_attract: 1.0e+3
    penna_omg:  5.0e+5
    penna_thr: 1.0e+5

  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 2
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: true
    opt_accuracy: 1.0e-5
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 1200.0
    penna_ts: 1.0e+5
    penna_pos: 1.0e+6
    penna_vel: 1.0e+5
    penna_acc: 1.0e+5
    penna_jerk: -1.0e+5
    penna_omg: 1.0e+5
    penna_max_acc_thr: 1.0e+5
    penna_min_acc_thr: 1.0e+5

  flatness:
    mass: 2.33
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81

astar:
  map_voxel_num: [200, 200, 100]
  visual_process: false
  allow_diag: true
  heu_type: 2
  debug_visualization_en: false

rog_map:
  resolution: 0.1
  inflation_resolution: 0.1
  # DO NOT raise this to match robot_r -- tried and reverted 17 Aug 2026.
  #
  # Context: CIRI hard-rejects a corridor seed whenever an obstacle (or, with
  # frontend_in_known_free, an UNKNOWN voxel) is closer than robot_r=0.42 to the
  # seed segment -- ciri.cpp:102, a flat FAILED with no degradation. The A*
  # front-end plans on THIS inflated map and so only certifies 0.20m, which
  # looked like the whole story: the two halves of the planner disagree, ~95% of
  # plans are discarded, and the drone rides each committed traj out to its
  # braking tail before lurching on the rare PlanFromRest (which starts from
  # ZERO velocity) -- the stop-and-go.
  #
  # Raising step 2->4 (0.40m) was flight-tested in bmich and made things WORSE:
  # PlanFromRest failures went 97% -> 99%, and the dominant error changed to
  # 16k x "The start point in obstacle, this should not happen" + 18k x
  # "PathSearch for new path failed". At 0.10m resolution a 0.40m inflation
  # swallows the drone's OWN position, and the start-shift uses non-inflated
  # occupancy so it cannot rescue it -- A* then fails before any corridor is
  # attempted. SUPER produced 48 successful plans in a 5-minute tour and the
  # aircraft ran away 133m. Measured CIRI infeasibility distances also showed
  # only 41% sit at the inflation edge; 59% are under 0.30m, i.e. UNKNOWN voxels
  # touching the path (unk_inflation_en is false, so the front-end is blind to
  # them). Inflation was never going to close that half.
  #
  # The gap has to be closed from the CIRI side (lower robot_r and/or drop
  # avoid_unknown_), not by inflating the front-end. See the 17 Aug analysis.
  inflation_step: 2
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [20, 20, 10]
  fix_map_origin: [0, 0, 0]
  frontier_extraction_en: false

  # Absolute safety cap below the staircase_test roof underside at Z=11.5m.
  # The local map remains sliding; only this hard world-frame ceiling must move.
  virtual_ceil_height: 11.4
  virtual_ground_height: 0.15

  load_pcd_en: false

  map_sliding:
    enable: true
    threshold: 3.0

  esdf:
    enable: false
    resolution: 0.1
    local_update_box: [5, 5, 3]

  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered_world"
    odom_topic: "/lidar_slam/odom"
    odom_timeout: 2.0

  visualization:
    enable: true
    use_dynamic_reconfigure: false
    time_rate: 2
    frame_rate: 0
    range: [20, 20, 10]
    frame_id: "world"
    pub_unknown_map_en: false

  intensity_thresh: -10
  point_filt_num: 3

  raycasting:
    enable: true                  # was false - needed to clear thickened walls
    batch_update_size: 1          # 1 = apply each scan immediately (more reactive to movers)
    # MUST match map_size. Was [20,20,4] against map_size Z=10 (the comment
    # here used to read "match map size" and had stopped being true when
    # map_size Z was grown 4->10): a return outside this box sets
    # update_hit=false and is used ONLY to carve FREE space up to the box
    # face, so occupancy hits were confined to a +/-2.0m band around the
    # AIRCRAFT inside a 10m-tall map and ~60%% of the map's height could never
    # receive one. Measured 20 Aug 2026 on four bmich walls: ROG-Map's
    # occupancy stopped within 0.05m of drone_z+2.0 while OctoMap held the
    # same wall to its true 4.0m top from the same cloud at the same instant.
    # Fixing it closed the gap at every measurement point (see
    # rogmap_map_gap.md and runs/val/2026-08-20_10-*_boxz-*_clean).
    #
    # Cost, measured on the same A/B: per-update mean 9.79 -> 14.12ms (+44%%),
    # p95 15.7 -> 22.4ms, i.e. 16%% -> 22%% of the 100ms budget at 10Hz, with
    # zero updates over budget. At MATCHED workload (binned by CacheNumber)
    # the cost is flat to slightly lower -- the extra time is 64%% more cells
    # written, which is the point, not overhead.
    local_update_box: [20, 20, 10]
    ray_range: [0.5, 15]          # was [0.5, 100] - no need to raycast beyond sensor range
    p_min: 0.12
    # Dynamic reactivity (Jul 2026): movers leave trails that block A* after they
    # leave, and slow clearing is the main "stuck after obstacle gone" cause.
    # p_miss/p_max aggressive for trail clear.
    #
    # FIXED (28 Jul 2026): p_max 0.88 / p_occ 0.80 left only ~0.014 log-odds of
    # margin between a fully-saturated occupied wall (l_max) and the occupied
    # threshold (l_occ) -- a SINGLE miss (l_miss=-0.619 at p_miss=0.35) dropped
    # a solid wall clean out of the OCCUPIED classification. SUPER's corridor
    # generator (corridor_generator.cpp boxSearch(..., OCCUPIED, ...)) only
    # avoids cells still classified OCCUPIED, so one grazing/oblique ray at a
    # wall edge or corner made that wall invisible to the flight corridor --
    # confirmed live: SUPER planned straight through walls OctoMap (separately,
    # more conservatively tuned) still correctly showed occupied. p_max raised
    # and p_occ lowered so ~3 consecutive misses are needed to un-occupy a
    # saturated cell (was 1); p_miss left alone so new-obstacle hit-confirmation
    # speed and most of the fast trail-clearing benefit are unchanged (full
    # clear-to-known-free is now ~6 misses, vs ~5 before this fix and ~8 on the
    # original pre-reactivity tuning). If wall flicker still appears, raise
    # p_max further before touching p_miss (that reopens the fast-clearing win
    # this was tuned for).
    p_miss: 0.35
    p_free: 0.28
    p_occ: 0.70                   # lower = more occupied-margin AND faster new-hit occ confirmation
    p_hit: 0.90
    p_max: 0.94                   # raised from 0.88 -- restores occupied-margin against single misses
    unk_thresh: 1.0
