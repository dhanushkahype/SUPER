# PX4-specific SUPER planner config
# Based on static_dense.yaml, tuned for PX4 SITL + OMMPC integration testing.
# Key changes from stock:
#   - Conservative velocity/acceleration limits for first integration test
#   - click_height disabled so global 3D goal Z passes through unchanged
#   - Vertical map volume expanded for two-storey stairwell navigation
#   - ROG-Map visualization enabled for debugging
#   - raycasting disabled (using ground-truth sim pointcloud)

fsm:
  click_goal_en: true
  click_goal_topic: "/planning/click_goal"
  click_height: -6.0          # disabled (any value <= -5 passes goal Z through unchanged)
  click_yaw_en: true
  replan_rate: 10.0
  cmd_topic: "/planning/pos_cmd"
  mpc_cmd_topic: "/planning_cmd/poly_traj"
  timer_en: true

super_planner:
  backup_traj_en: true
  detailed_log_en: false
  visualization_en: true
  use_fov_cut: false
  print_log: false
  visual_process: false
  frontend_in_known_free: true
  continuous_following: true
  # Near a static goal (global path end / final click): brake terminal velocity
  # and stop continuous replan so the drone settles instead of oscillating.
  # Orbit carrots stay ~lookahead away and are unaffected.
  goal_stop_dis: 1.20
  goal_arrive_dis: 0.60
  goal_arrive_vel: 0.30
  # Autonomous stuck recovery (plan fail streaks, ~main/replan tick counts).
  # L1 re-snap goal free; L2 temporarily plan through unknown;
  # L2.5 hard-reset in-process ROG local map (clear phantoms);
  # L3 WAIT_GOAL.
  stuck_fail_count: 15
  stuck_relax_count: 30
  stuck_reset_map_count: 40
  stuck_reset_map_cooldown: 20.0   # [s] min time between ROG hard resets
  stuck_give_up_count: 60
  goal_yaw_en: true
  goal_vel_en: false
  corridor_bound_dis: 0.8
  corridor_line_max_length: 1.0
  safe_corridor_line_max_length: 6.0
  iris_iter_num: 2
  obs_skip_num: 2
  replan_forward_dt: 0.1
  planning_horizon: 7.0
  sensing_horizon: -1
  receding_dis: 1.0
  robot_r: 0.35
  yaw_dot_max: 1.5
  yaw_mode: 1
  mpc_horizon: 15

traj_opt:
  switch:
    save_log_en: false
    print_optimizer_log: false

  boundary:
    max_vel: 1.5
    max_acc: 2.0
    max_jerk: 15.0
    max_omg: 1.0
    max_acc_thr: 12.0
    min_acc_thr: 5.0
    penna_margin: 0.05

  exp_traj:
    pos_constraint_type: 1
    energy_cost_type: 4
    block_energy_cost: false
    opt_accuracy: 5.0e-6
    scale_factor: 1.0
    integral_reso: 15
    smooth_eps: 0.01
    penna_t: 12000.0
    penna_pos: 5.0e+6
    penna_vel: 5.0e+5
    penna_acc: 5.0e+5
    penna_jerk: -5.0e+5
    penna_attract: 1.0e+3
    penna_omg:  5.0e+5
    penna_thr: 1.0e+5

  backup_traj:
    uniform_time_en: true
    pos_constraint_type: 2
    piece_num: 2
    energy_cost_type: 4
    block_energy_cost: true
    opt_accuracy: 1.0e-5
    scale_factor: 1.0
    integral_reso: 12
    smooth_eps: 0.01
    penna_t: 1200.0
    penna_ts: 1.0e+5
    penna_pos: 1.0e+6
    penna_vel: 1.0e+5
    penna_acc: 1.0e+5
    penna_jerk: -1.0e+5
    penna_omg: 1.0e+5
    penna_max_acc_thr: 1.0e+5
    penna_min_acc_thr: 1.0e+5

  flatness:
    mass: 2.33
    dh: 0.35
    dv: 0.35
    cp: 0.001
    v_eps: 0.0001
    grav: 9.81

astar:
  map_voxel_num: [200, 200, 100]
  visual_process: false
  allow_diag: true
  heu_type: 2
  debug_visualization_en: false

rog_map:
  resolution: 0.1
  inflation_resolution: 0.1
  inflation_step: 2
  unk_inflation_en: false
  unk_inflation_step: 1
  map_size: [20, 20, 10]
  fix_map_origin: [0, 0, 0]
  frontier_extraction_en: false

  # Absolute safety cap below the staircase_test roof underside at Z=11.5m.
  # The local map remains sliding; only this hard world-frame ceiling must move.
  virtual_ceil_height: 11.4
  virtual_ground_height: 0.15

  load_pcd_en: false

  map_sliding:
    enable: true
    threshold: 3.0

  esdf:
    enable: false
    resolution: 0.1
    local_update_box: [5, 5, 3]

  ros_callback:
    enable: true
    cloud_topic: "/cloud_registered_world"
    odom_topic: "/lidar_slam/odom"
    odom_timeout: 2.0

  visualization:
    enable: true
    use_dynamic_reconfigure: false
    time_rate: 2
    frame_rate: 0
    range: [20, 20, 10]
    frame_id: "world"
    pub_unknown_map_en: false

  intensity_thresh: -10
  point_filt_num: 3

  raycasting:
    enable: true                  # was false - needed to clear thickened walls
    batch_update_size: 1          # 1 = apply each scan immediately (more reactive to movers)
    local_update_box: [20, 20, 4] # was [100, 100, 5] - match map size
    ray_range: [0.5, 15]          # was [0.5, 100] - no need to raycast beyond sensor range
    p_min: 0.12
    # Dynamic reactivity (Jul 2026): movers leave trails that block A* after they
    # leave, and slow clearing is the main "stuck after obstacle gone" cause.
    # p_miss/p_max aggressive for trail clear; watch wall flicker at corners —
    # back off p_miss toward 0.38 first if static walls shimmer.
    p_miss: 0.35
    p_free: 0.28
    p_occ: 0.80                   # slightly lower so one hit + trail still marks occ fast
    p_hit: 0.90
    p_max: 0.88                   # caps saturation depth → vacated cells clear faster
    unk_thresh: 1.0
